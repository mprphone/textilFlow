databases:
  - name: textileflow-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: textileflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: textileflow-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: CORS_ORIGINS
        value: "*"
