services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: textileflow
      POSTGRES_USER: textileflow
      POSTGRES_PASSWORD: textileflow_demo
    volumes:
      - textileflow_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textileflow -d textileflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://textileflow:textileflow_demo@db:5432/textileflow
      APP_SECRET: ${APP_SECRET:-change-me-before-production}
      APP_ALLOW_WEAK_SECRET: ${APP_ALLOW_WEAK_SECRET:-1}
      RUN_INPROCESS_WORKERS: "0"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://textileflow:textileflow_demo@db:5432/textileflow
      APP_SECRET: ${APP_SECRET:-change-me-before-production}
      APP_ALLOW_WEAK_SECRET: ${APP_ALLOW_WEAK_SECRET:-1}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./backend/app:/app/app
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  textileflow_pg:
